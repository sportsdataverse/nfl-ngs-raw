name: nfl-ngs-data trigger

# Every push to main wakes the sibling nfl-ngs-data compile via
# repository_dispatch, forwarding the head commit message. nfl-ngs-data parses
# the season range out of it with `Start:\s*\K[0-9]{4}` / `End:\s*\K[0-9]{4}`,
# anchored to the canonical "NGS Raw Update (Start: YYYY End: YYYY)" subject
# scripts/daily_ngs_scraper.sh writes -- so embedded numbers elsewhere in a
# message (PR ids, counts) cannot shadow the years. A push whose message has no
# such tokens (a code change) makes the data side fall back to the current
# season, which is the right default.
#
# Needs SDV_GH_TOKEN (a PAT with repo scope on nfl-ngs-data); the default
# GITHUB_TOKEN cannot dispatch to another repo.

on: [push, workflow_dispatch]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  trigger:
    runs-on: ubuntu-latest
    # `on: push` has no branch filter here, and the dispatch payload is hardcoded to
    # refs/heads/main, so a feature-branch or tag push started a production build of
    # work that had not landed (cfbfastR-cfb-raw#10). Same guard as that repo.
    if: github.ref == 'refs/heads/main'
    steps:
      # scripts/daily_ngs_scraper.sh pushes the data commit, then a separate
      # "NGS Raw log update" commit seconds later. Both used to dispatch, so the
      # data side ran twice every morning; the second run built on the SHA frozen
      # at its event, lost the push, and went red daily (2026-09-10..14).
      # Skip a push made ONLY of log-update commits. Every commit is checked, not
      # just head_commit: if a rejected data push is retried and carried by the
      # log push, head_commit is the log commit and the data must still dispatch.
      - name: Skip log-only pushes
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          COMMITS: ${{ toJSON(github.event.commits) }}
        run: |
          if [ "$EVENT" != "push" ]; then echo "dispatch=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          n=$(printf '%s' "$COMMITS" | jq '[.[] | select(.message | startswith("NGS Raw log update") | not)] | length')
          echo "non-log commits in push: $n"
          if [ "$n" -gt 0 ]; then echo "dispatch=true" >> "$GITHUB_OUTPUT"; else echo "dispatch=false" >> "$GITHUB_OUTPUT"; fi

      - name: Trigger nfl-ngs-data
        if: steps.gate.outputs.dispatch == 'true'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.SDV_GH_TOKEN }}
          repository: sportsdataverse/nfl-ngs-data
          event-type: daily_nfl_ngs_data
          client-payload: |-
            {
              "ref": "refs/heads/main",
              "event_name": "daily_nfl_ngs_data",
              "commit_message": ${{ toJSON(github.event.head_commit.message) }}
            }
