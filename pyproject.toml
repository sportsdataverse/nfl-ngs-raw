[project]
name = "nfl-ngs-raw"
version = "0.1.0"
description = "Scrapes Next Gen Stats (nextgenstats.nfl.com/api) JSON into a committed raw library (sibling of nfl-ngs-data, which owns reshaping + publishing)."
requires-python = ">=3.11"
dependencies = [
    # dl_utils.download (pooled session + retry/backoff) and most_recent_nfl_season.
    "sportsdataverse @ git+https://github.com/sportsdataverse/sportsdataverse-py@main",
    "polars>=1.0,<2.0",
    "requests>=2.28",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# python/ is the source dir. The numbered ngs_NN_*_scrape.py shims sit beside the
# package and are run by path; the package itself is what gets installed.
[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
markers = ["archive: dated one-off probes, not run in CI"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Pinned rule set: relying on ruff defaults makes the gate version-sensitive.
select = ["E4", "E7", "E9", "F", "I"]
# Explicit polars bool masks (pl.col("c") == True/False) are the project convention.
ignore = ["E712"]
